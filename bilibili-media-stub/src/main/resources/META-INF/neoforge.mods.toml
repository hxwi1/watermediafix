# ============================================================================
# bilibili_media 元数据空壳（MediaFix 附属）
#
# 作用：让客户端的模组列表里出现 bilibili_media 2.3，从而通过服务端
#       MATCH_VERSION 校验（服务端装了真的 bilibili_media 2.3 且无法改动）。
#
# 设计要点：
#   * modId / version 必须与真货逐字一致 —— 校验只比对这两个字符串。
#   * modLoader 用 lowcodefml：NeoForge 为"无代码 mod"提供的加载器，本壳不含任何类。
#   * 不声明任何 [[dependencies]]：真货要求 watermedia（side=BOTH），本壳刻意不要求，
#     否则客户端会被额外拖上 watermedia 2.x 的版本约束。
#   * displayTest 用 IGNORE_ALL_VERSION：本壳自身不参与任何版本校验。服务端那头要
#     求"客户端必须有同版本 bilibili_media"仍然由服务端自己的 MATCH_VERSION 决定，
#     与这里的取值无关；而这样写可以避免本壳反过来把玩家挡在"没装 bilibili_media
#     的其它服务器"门外。
# ============================================================================
modLoader="lowcodefml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="bilibili_media"
version="2.3"
displayName="Bilibili Media Mod"
displayTest="IGNORE_ALL_VERSION"
description='''
MediaFix 空壳条目：仅用于通过服务端 NeoForge 的模组列表（MATCH_VERSION）校验。
不含任何代码，不提供任何功能；B 站链接解析与播放由 MediaFix 自行实现。
'''
