// ============================================================================
// bilibili_media 空壳（stub）—— 只为通过 NeoForge 的模组列表校验，不含任何代码。
//
// 背景：服务端装了真的 bilibili_media 2.3，而它的 neoforge.mods.toml 里没有写
// displayTest（NeoForge 默认 MATCH_VERSION），语义是「两端都必须有这个 mod 且版本
// 一致」。客户端只要在自己的模组列表里出现一个 modId=bilibili_media、version=2.3
// 的条目，校验即通过——校验只比对 id + 版本字符串，不看 jar 内容。
//
// 本工程被主工程以 jar-in-jar 方式打包进 mediafix，玩家侧无需额外操作。
// ============================================================================
plugins {
    id 'java'
}

// 必须与真货完全一致
version = '2.3'
group = 'dev.mediafix.stub'

base {
    archivesName = 'bilibili_media-stub'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 只有资源（META-INF/neoforge.mods.toml），没有任何 Java 源码：
// 该 mod 用 NeoForge 的 lowcodefml 加载器（无代码 mod 专用），因此不需要 NeoForge 依赖。
tasks.named('jar', Jar).configure {
    archiveVersion = ''            // 文件名保持 bilibili_media-stub.jar，避免误导
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('processResources') {
    // 这个 toml 必须原样进入 jar，绝不做任何属性展开
    filteringCharset = 'UTF-8'
}
